name: Job Updates
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Telegram par 3 test message bhejo"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: job-updates
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TEST: ${{ inputs.test_telegram && '1' || '' }}
        run: python scripts/fetch_jobs.py
      - name: Save jobs.json
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "update jobs" && git push)
