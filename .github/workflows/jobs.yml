name: Job Updates
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: job-updates
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_LAYOUT: post   # apni site ke post layout ka naam (_layouts/post.html)
        run: python scripts/fetch_jobs.py
      - name: Commit to site
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.json _data
          [ -d _posts ] && git add _posts || true
          git diff --cached --quiet || (git commit -m "auto: job updates" && git pull --rebase -q && git push)
