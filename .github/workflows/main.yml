name: JobTejas Bot Auto-Runner

on:
  schedule:
    - cron: '0 */6 * * *'  # Ye command ise har 6 ghante mein chalayegi
  workflow_dispatch:       # Isse aap jab chahein button dabakar manual run bhi kar sakte hain

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # GITHUB_TOKEN ko permission dena taaki wo seen_links.txt file ko save kar sake
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Python Setup Karna
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Zaroori Libraries Install Karna
        run: |
          pip install -r requirements.txt

      - name: JobTejas Bot Run Karna
        run: |
          python jobtejas_bot.py

      - name: Naye Links ko File mein Save Karna (Auto-Commit)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_links.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated seen_links.txt" && git push)
